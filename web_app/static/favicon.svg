<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2E86DE"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="24" cy="24" r="24" fill="#0a0e1a"/>
  
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#grad)" stroke-width="2"/>
  
  <!-- University building / graduation cap -->
  <path d="M24 8l12 6-12 6-12-6z" fill="url(#grad)" opacity="0.3"/>
  <path d="M24 8l12 6-12 6-12-6z" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Building columns -->
  <path d="M14 20v12M20 18v14M24 17v15M28 18v14M34 20v12" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Base -->
  <path d="M12 34h24" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Checkmark accent -->
  <circle cx="38" cy="24" r="4" fill="url(#accent)"/>
  <path d="M36 24l1.5 1.5 3-3" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
