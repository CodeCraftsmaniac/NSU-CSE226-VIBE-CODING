# NSU Degree Audit - CI/CD Pipeline
# ==================================
# Runs the backend and integration-facing checks against the current repository layout.

name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'cli_app/**'
      - 'web_app/**'
      - 'flutter_app/**'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/load-testing.yml'
      - 'Dockerfile'
      - 'requirements.txt'
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint fatal backend issues
        run: |
          python -m flake8 . --jobs 1 --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check backend formatting
        run: |
          python -m black --check app tests ../cli_app/cli_auth.py ../backend/database.py
        continue-on-error: true

      - name: Run backend tests
        run: |
          python -m pytest tests -v --tb=short

      - name: Verify backend imports
        run: |
          python -c "from app.main import app; print('✅ FastAPI backend imports successfully')"
          python -c "from core import run_full_analysis; print('✅ Core analysis imports successfully')"
          python -c "from database import get_supabase; print('✅ Database module imports successfully')"
          python -c "from auth import verify_supabase_token; print('✅ Auth module imports successfully')"

      - name: Smoke test health endpoints
        run: |
          python -c "from fastapi.testclient import TestClient; from app.main import app; client = TestClient(app); live = client.get('/health/live'); ready = client.get('/health/ready'); assert live.status_code == 200; assert ready.status_code in (200, 503); print('✅ Health smoke checks passed')"

  cli-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install CLI dependencies
        run: |
          pip install -r requirements.txt -r backend/requirements.txt

      - name: Verify CLI imports
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); from cli_app.cli_auth import CLIAuth; print('✅ CLI auth imports')"

      - name: Test CLI help
        run: |
          python cli_app/main.py --help

  webapp-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install web app dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify web app imports
        run: |
          python -c "from app import app; print('✅ Web app imports successfully')"

  flutter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/
        continue-on-error: true

      - name: Run tests
        run: flutter test

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tooling
        run: |
          pip install pip-audit

      - name: Audit backend dependencies
        run: |
          pip-audit -r requirements.txt
        continue-on-error: true

      - name: Check for committed secrets
        working-directory: .
        run: |
          ! grep -R --line-number --include="*.py" --include="*.dart" --include="*.js" --include="*.html" \
            -E "SUPABASE_ANON_KEY = \"|SUPABASE_URL = \"https://.*supabase.co|AIza[0-9A-Za-z_-]{35}" \
            backend cli_app web_app flutter_app docs \
            || (echo "::error::Potential committed secrets found" && exit 1)

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nsu-audit-api:test .

      - name: Verify Docker image
        run: |
          docker run --rm nsu-audit-api:test python -c "from app.main import app; print('✅ Docker build verified')"
