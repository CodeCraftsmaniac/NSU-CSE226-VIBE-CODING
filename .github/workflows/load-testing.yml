name: Load Testing

on:
  workflow_dispatch:
    inputs:
      test_preset:
        description: 'Test preset to run'
        required: true
        default: 'default'
        type: choice
        options:
          - quick
          - default
          - concurrent20
          - stress
      target_host:
        description: 'Target host URL'
        required: true
        default: 'https://ocrapi.nsunexus.app'
        type: string
  
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/tests/**'
      - '.github/workflows/load-testing.yml'
      - 'Dockerfile'

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check load test harness
        id: harness
        shell: bash
        run: |
          if [ -f backend/tests/run_load_test.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.harness.outputs.present == 'true'
        run: pip install locust requests

      - name: Determine test configuration
        if: steps.harness.outputs.present == 'true'
        id: config
        shell: bash
        run: |
          PRESET="${{ github.event.inputs.test_preset || 'default' }}"
          HOST="${{ github.event.inputs.target_host || 'https://ocrapi.nsunexus.app' }}"

          echo "preset=$PRESET" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Run Load Test
        if: steps.harness.outputs.present == 'true'
        id: loadtest
        shell: bash
        run: |
          python backend/tests/run_load_test.py \
            --${{ steps.config.outputs.preset }} \
            --host=${{ steps.config.outputs.host }}
        continue-on-error: true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always() && steps.harness.outputs.present == 'true'
        with:
          name: load-test-reports-${{ github.run_id }}
          path: backend/tests/reports/*.*
          retention-days: 30

      - name: Parse Results and Create Summary
        if: always()
        shell: bash
        run: |
          echo "## Load Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.harness.outputs.present }}" != "true" ]; then
            echo "Skipped: \`backend/tests/run_load_test.py\` is not present in this repository." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "**Preset:** ${{ steps.config.outputs.preset }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target:** ${{ steps.config.outputs.host }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          STATS_FILE=$(ls -t backend/tests/reports/*_stats.csv 2>/dev/null | head -1)
          if [ -f "$STATS_FILE" ]; then
            echo "### Endpoint Statistics" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            cat "$STATS_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.loadtest.outcome }}" = "success" ]; then
            echo "### Passed" >> "$GITHUB_STEP_SUMMARY"
            echo "The load test completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the uploaded artifacts for the detailed report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check Test Outcome
        if: steps.harness.outputs.present == 'true' && steps.loadtest.outcome == 'failure'
        run: exit 1

  quick-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check load test harness
        id: quickharness
        shell: bash
        run: |
          if [ -f backend/tests/run_load_test.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.quickharness.outputs.present == 'true'
        run: pip install locust requests

      - name: Run Quick Smoke Test
        if: steps.quickharness.outputs.present == 'true'
        shell: bash
        run: |
          python backend/tests/run_load_test.py --quick --no-report

      - name: Summarize skip
        if: steps.quickharness.outputs.present != 'true'
        run: |
          echo "Quick load-test smoke check skipped because backend/tests/run_load_test.py is not present."
